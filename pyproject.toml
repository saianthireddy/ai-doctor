[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aidoctor"
version = "0.1.0"
description = "Document intelligence: extract, chunk, embed, hybrid-search, rerank and answer with citations."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sai Kumar Reddy Anthireddy" }]
keywords = ["rag", "retrieval", "hybrid-search", "qdrant", "fastapi", "document-intelligence"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Text Processing :: Indexing",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "python-multipart>=0.0.9",
  "numpy>=1.26",
  "sqlalchemy>=2.0",
  "qdrant-client>=1.9",
  "pypdf>=4.2",
  "python-docx>=1.1",
  "python-pptx>=0.6.23",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
openai = ["openai>=1.30"]
rerank = ["sentence-transformers>=2.7"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "reportlab>=4.1", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/saianthireddy/ai-doctor"
Documentation = "https://github.com/saianthireddy/ai-doctor/tree/main/docs"
Issues = "https://github.com/saianthireddy/ai-doctor/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["integration: end-to-end tests across the whole pipeline"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.coverage.run]
source = ["src/aidoctor"]
branch = true
omit = ["*/llms/base.py:OpenAIChatLLM"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "raise NotImplementedError", "if TYPE_CHECKING:"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET"]
ignore = ["B008"]   # FastAPI's File()/Depends() defaults are the documented idiom

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
