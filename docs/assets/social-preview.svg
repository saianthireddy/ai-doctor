<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="AI Doctor">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0B1B33"/>
      <stop offset="45%"  stop-color="#0A1122"/>
      <stop offset="100%" stop-color="#03060F"/>
    </linearGradient>
    <radialGradient id="g1">
      <stop offset="0%"   stop-color="#22D3EE" stop-opacity="0.26"/>
      <stop offset="60%"  stop-color="#22D3EE" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2">
      <stop offset="0%"   stop-color="#2DD4BF" stop-opacity="0.22"/>
      <stop offset="60%"  stop-color="#2DD4BF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#7DF5DE"/>
      <stop offset="55%"  stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="page" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D6E1F0"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#22D3EE" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="230"  cy="40"  r="380" fill="url(#g1)"/>
  <circle cx="1080" cy="100" r="360" fill="url(#g2)"/>

  <!-- mark -->
  <g transform="translate(551, 62) scale(0.55) translate(-110, -40)">
    <g transform="rotate(-6 256 256)" filter="url(#soft)">
      <path d="M128 96 h152 l62 62 v254 a18 18 0 0 1 -18 18 H128 a18 18 0 0 1 -18 -18 V114 a18 18 0 0 1 18 -18 z" fill="url(#page)"/>
      <path d="M280 96 l62 62 h-46 a16 16 0 0 1 -16 -16 z" fill="#A3B2C7"/>
      <rect x="146" y="196" width="154" height="15" rx="7.5" fill="#B4C1D3"/>
      <rect x="146" y="234" width="116" height="15" rx="7.5" fill="#B4C1D3"/>
      <path d="M146 288 H180 L191 260 L206 314 L219 280 H302" fill="none" stroke="url(#teal)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="146" y="338" width="90" height="15" rx="7.5" fill="#B4C1D3"/>
    </g>
    <g filter="url(#glow)">
      <path d="M296 104 C 414 128, 436 272, 366 336" fill="none" stroke="url(#teal)" stroke-width="26" stroke-linecap="round"/>
      <circle cx="296" cy="104" r="21" fill="#67E8F9"/>
      <circle cx="354" cy="380" r="62" fill="url(#teal)"/>
      <circle cx="354" cy="380" r="31" fill="#050B18"/>
      <circle cx="338" cy="360" r="10" fill="#FFFFFF" opacity="0.55"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="402" y="392" font-family="Carlito, DejaVu Sans, sans-serif" font-size="96" font-weight="bold" letter-spacing="2" fill="url(#cyan)">AI</text>
  <text x="533" y="392" font-family="Carlito, DejaVu Sans, sans-serif" font-size="96" font-weight="bold" letter-spacing="2" fill="#F1F5F9">DOCTOR</text>

  <text x="640" y="452" text-anchor="middle" font-family="Carlito, DejaVu Sans, sans-serif" font-size="30" fill="#9AACC2">
    Document intelligence that cites its sources — or admits it doesn't know.
  </text>

  <rect x="215" y="502" width="850" height="58" rx="29" fill="#0C1A2C" stroke="#1C3557" stroke-width="2"/>
  <text x="640" y="540" text-anchor="middle" font-family="Carlito, DejaVu Sans, sans-serif" font-size="23" fill="#9FB3C8">
    FastAPI  ·  Qdrant  ·  BM25 + RRF  ·  SQLAlchemy  ·  Docker  ·  pytest
  </text>

  <text x="640" y="596" text-anchor="middle" font-family="Carlito, DejaVu Sans, sans-serif" font-size="21" fill="#5C7391">
    116 tests  ·  94% coverage  ·  runs offline with no API key  ·  MIT
  </text>
</svg>
