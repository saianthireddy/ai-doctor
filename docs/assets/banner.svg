<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" width="1600" height="640" role="img" aria-label="AI Doctor">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0B1B33"/>
      <stop offset="45%"  stop-color="#0A1122"/>
      <stop offset="100%" stop-color="#03060F"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#7DF5DE"/>
      <stop offset="55%"  stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="page" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D6E1F0"/>
    </linearGradient>
    <radialGradient id="g1">
      <stop offset="0%"   stop-color="#22D3EE" stop-opacity="0.26"/>
      <stop offset="60%"  stop-color="#22D3EE" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2">
      <stop offset="0%"   stop-color="#2DD4BF" stop-opacity="0.22"/>
      <stop offset="60%"  stop-color="#2DD4BF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g3">
      <stop offset="0%"   stop-color="#0EA5E9" stop-opacity="0.18"/>
      <stop offset="60%"  stop-color="#0EA5E9" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#22D3EE" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1600" height="640" fill="url(#bg)"/>
  <circle cx="300"  cy="60"  r="380" fill="url(#g1)"/>
  <circle cx="1330" cy="110" r="360" fill="url(#g2)"/>
  <circle cx="820"  cy="680" r="440" fill="url(#g3)"/>

  <!-- ===== lockup: mark + wordmark ===== -->
  <g transform="translate(495, 45) scale(0.42) translate(-110, -40)">
    <g transform="rotate(-6 256 256)" filter="url(#soft)">
      <path d="M128 96 h152 l62 62 v254 a18 18 0 0 1 -18 18 H128 a18 18 0 0 1 -18 -18 V114 a18 18 0 0 1 18 -18 z" fill="url(#page)"/>
      <path d="M280 96 l62 62 h-46 a16 16 0 0 1 -16 -16 z" fill="#A3B2C7"/>
      <rect x="146" y="196" width="154" height="15" rx="7.5" fill="#B4C1D3"/>
      <rect x="146" y="234" width="116" height="15" rx="7.5" fill="#B4C1D3"/>
      <path d="M146 288 H180 L191 260 L206 314 L219 280 H302" fill="none" stroke="url(#teal)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="146" y="338" width="90" height="15" rx="7.5" fill="#B4C1D3"/>
    </g>
    <g filter="url(#glow)">
      <path d="M296 104 C 414 128, 436 272, 366 336" fill="none" stroke="url(#teal)" stroke-width="26" stroke-linecap="round"/>
      <circle cx="296" cy="104" r="21" fill="#67E8F9"/>
      <circle cx="354" cy="380" r="62" fill="url(#teal)"/>
      <circle cx="354" cy="380" r="31" fill="#050B18"/>
      <circle cx="338" cy="360" r="10" fill="#FFFFFF" opacity="0.55"/>
    </g>
  </g>

  <text x="662" y="162" font-family="Carlito, DejaVu Sans, sans-serif" font-size="86" font-weight="bold" letter-spacing="1" fill="url(#cyan)">AI</text>
  <text x="778" y="162" font-family="Carlito, DejaVu Sans, sans-serif" font-size="86" font-weight="bold" letter-spacing="1" fill="#F1F5F9">DOCTOR</text>

  <!-- tagline -->
  <text x="800" y="258" text-anchor="middle" font-family="Carlito, DejaVu Sans, sans-serif" font-size="31" fill="#9AACC2">
    Document intelligence that cites its sources — or admits it doesn't know.
  </text>

  <line x1="380" y1="304" x2="1220" y2="304" stroke="#1C3557" stroke-width="2"/>

  <!-- ===== capability row ===== -->
  <g font-family="Carlito, DejaVu Sans, sans-serif">

    <g transform="translate(183,0)">
      <g transform="translate(-22,336)" fill="none" stroke="url(#cyan)" stroke-width="3.4" stroke-linejoin="round">
        <rect x="4" y="0" width="30" height="38" rx="4"/>
        <path d="M12 10 h14 M12 19 h14 M12 28 h9"/>
        <path d="M40 8 v34 a4 4 0 0 1 -4 4 H14"/>
      </g>
      <text x="0" y="422" text-anchor="middle" font-size="22" font-weight="bold" fill="#E2E8F0">Six file formats</text>
      <text x="0" y="452" text-anchor="middle" font-size="18" fill="#7F91A8">PDF · DOCX · PPTX</text>
      <text x="0" y="476" text-anchor="middle" font-size="18" fill="#7F91A8">XLSX · HTML · MD</text>
    </g>

    <g transform="translate(430,0)">
      <g transform="translate(-22,336)" fill="none" stroke="url(#cyan)" stroke-width="3.4" stroke-linecap="round">
        <path d="M2 4 C 18 4, 18 24, 34 24"/>
        <path d="M2 44 C 18 44, 18 24, 34 24"/>
        <path d="M34 24 h10"/>
        <circle cx="44" cy="24" r="5" fill="#2DD4BF" stroke="none"/>
      </g>
      <text x="0" y="422" text-anchor="middle" font-size="22" font-weight="bold" fill="#E2E8F0">Hybrid retrieval</text>
      <text x="0" y="452" text-anchor="middle" font-size="18" fill="#7F91A8">BM25 + dense, fused</text>
      <text x="0" y="476" text-anchor="middle" font-size="18" fill="#7F91A8">with Reciprocal Rank</text>
    </g>

    <g transform="translate(677,0)">
      <g transform="translate(-22,336)" fill="none" stroke="url(#cyan)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 2 H2 v42 h6"/>
        <path d="M36 2 h6 v42 h-6"/>
        <path d="M14 17 h16 M14 29 h10"/>
      </g>
      <text x="0" y="422" text-anchor="middle" font-size="22" font-weight="bold" fill="#E2E8F0">Answers cite a place</text>
      <text x="0" y="452" text-anchor="middle" font-size="18" fill="#7F91A8">file + page, slide,</text>
      <text x="0" y="476" text-anchor="middle" font-size="18" fill="#7F91A8">sheet or section</text>
    </g>

    <g transform="translate(923,0)">
      <g transform="translate(-22,336)" fill="none" stroke="url(#cyan)" stroke-width="3.4" stroke-linecap="round">
        <circle cx="22" cy="23" r="20"/>
        <path d="M9 10 L35 36"/>
      </g>
      <text x="0" y="422" text-anchor="middle" font-size="22" font-weight="bold" fill="#E2E8F0">It refuses</text>
      <text x="0" y="452" text-anchor="middle" font-size="18" fill="#7F91A8">out-of-corpus questions</text>
      <text x="0" y="476" text-anchor="middle" font-size="18" fill="#7F91A8">get no answer, by test</text>
    </g>

    <g transform="translate(1170,0)">
      <g transform="translate(-22,336)" fill="none" stroke="url(#cyan)" stroke-width="3.4">
        <circle cx="16" cy="23" r="14"/>
        <circle cx="30" cy="23" r="14"/>
      </g>
      <text x="0" y="422" text-anchor="middle" font-size="22" font-weight="bold" fill="#E2E8F0">Two vector stores</text>
      <text x="0" y="452" text-anchor="middle" font-size="18" fill="#7F91A8">Qdrant + exact reference,</text>
      <text x="0" y="476" text-anchor="middle" font-size="18" fill="#7F91A8">one contract suite</text>
    </g>

    <g transform="translate(1417,0)">
      <g transform="translate(-22,336)" fill="none" stroke="url(#cyan)" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round">
        <path d="M22 3 L41 13 v20 L22 43 L3 33 V13 z"/>
        <path d="M3 13 L22 23 L41 13 M22 23 v20"/>
      </g>
      <text x="0" y="422" text-anchor="middle" font-size="22" font-weight="bold" fill="#E2E8F0">Runs offline</text>
      <text x="0" y="452" text-anchor="middle" font-size="18" fill="#7F91A8">no API key needed;</text>
      <text x="0" y="476" text-anchor="middle" font-size="18" fill="#7F91A8">Docker booted in CI</text>
    </g>
  </g>

  <!-- ===== tech + proof strip ===== -->
  <rect x="370" y="518" width="860" height="58" rx="29" fill="#0C1A2C" stroke="#1C3557" stroke-width="2"/>
  <text x="800" y="556" text-anchor="middle" font-family="Carlito, DejaVu Sans, sans-serif" font-size="23" fill="#9FB3C8">
    FastAPI  ·  Qdrant  ·  BM25 + RRF  ·  SQLAlchemy  ·  Docker  ·  pytest
  </text>

  <text x="800" y="608" text-anchor="middle" font-family="Carlito, DejaVu Sans, sans-serif" font-size="21" fill="#5C7391">
    116 tests  ·  94% coverage  ·  CI on Python 3.11 and 3.12  ·  MIT
  </text>
</svg>
