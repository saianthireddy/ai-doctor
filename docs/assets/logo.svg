<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="AI Doctor">
  <defs>
    <linearGradient id="bgc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#172554"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="tealc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="55%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="pagec" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D8E2F0"/>
    </linearGradient>
    <filter id="softc" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="glowc" x="-70%" y="-70%" width="240%" height="240%">
      <feDropShadow dx="0" dy="0" stdDeviation="22" flood-color="#22D3EE" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bgc)"/>
  <circle cx="380" cy="120" r="150" fill="#22D3EE" opacity="0.10"/>
  <circle cx="110" cy="420" r="130" fill="#2DD4BF" opacity="0.07"/>

  <!-- back page, for depth -->
  <g transform="rotate(6 256 256)" opacity="0.35">
    <path d="M150 118 h140 l52 52 v232 a16 16 0 0 1 -16 16 H150 a16 16 0 0 1 -16 -16 V134 a16 16 0 0 1 16 -16 z" fill="#94A3B8"/>
  </g>

  <!-- front page -->
  <g transform="rotate(-6 256 256)" filter="url(#softc)">
    <path d="M128 96 h152 l62 62 v254 a18 18 0 0 1 -18 18 H128 a18 18 0 0 1 -18 -18 V114 a18 18 0 0 1 18 -18 z" fill="url(#pagec)"/>
    <path d="M280 96 l62 62 h-46 a16 16 0 0 1 -16 -16 z" fill="#A3B2C7"/>

    <rect x="146" y="196" width="154" height="13" rx="6.5" fill="#B4C1D3"/>
    <rect x="146" y="232" width="116" height="13" rx="6.5" fill="#B4C1D3"/>
    <path d="M146 284 H180 L191 258 L206 310 L219 278 H302"
          fill="none" stroke="url(#tealc)" stroke-width="13"
          stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="146" y="334" width="90" height="13" rx="6.5" fill="#B4C1D3"/>
  </g>

  <!-- stethoscope -->
  <g filter="url(#glowc)">
    <path d="M296 104 C 414 128, 436 272, 366 336"
          fill="none" stroke="url(#tealc)" stroke-width="24" stroke-linecap="round"/>
    <circle cx="296" cy="104" r="20" fill="#67E8F9"/>
    <circle cx="354" cy="380" r="62" fill="url(#tealc)"/>
    <circle cx="354" cy="380" r="31" fill="#050B18"/>
    <circle cx="338" cy="360" r="10" fill="#FFFFFF" opacity="0.55"/>
  </g>
</svg>
