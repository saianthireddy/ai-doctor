# Coverage is uploaded from ci.yml's test job (Python 3.12 leg).
#
# This file exists to hold the Codecov configuration in one place rather than
# scattering thresholds across workflow steps.
name: Coverage

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  report:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Coverage uploaded by the CI workflow's test job."
