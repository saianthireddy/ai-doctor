name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ai-doctor:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify the image actually serves
        # A build that succeeds but cannot boot is a green check that lies.
        run: |
          docker run -d --name aidoctor -p 8000:8000 ai-doctor:ci
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/v1/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/api/v1/health | grep -q '"status":"ok"'
          docker logs aidoctor
          docker rm -f aidoctor
