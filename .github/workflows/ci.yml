name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install ruff
      - run: ruff check src tests scripts
      - run: ruff format --check src tests

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test with coverage
        run: pytest --cov=src/aidoctor --cov-report=xml --cov-report=term
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  smoke:
    # Boots the app the way a user would and hits it over real HTTP. The test
    # suite uses TestClient, which never exercises the ASGI server itself.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - name: Boot and probe
        run: |
          uvicorn aidoctor.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/v1/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/api/v1/health | tee /dev/stderr | grep -q '"status":"ok"'
          curl -sf http://127.0.0.1:8000/openapi.json > /dev/null

  evaluate:
    # The README and docs/evaluation.md publish specific numbers. This job
    # regenerates them from a clean checkout and fails if they have drifted, so
    # the published figures cannot quietly become untrue.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - name: Score the labelled set
        run: python scripts/evaluate.py | tee eval.txt
      - name: The published numbers must still hold
        run: |
          grep -q '| hybrid + rerank | 0.674 | 0.209 | 0.801 | 0.844 | 0.748 | 0.752 |' eval.txt
          grep -q '| router (end to end) | 0.333 | 0.000 |' eval.txt
          grep -q 'corpus:    67 chunks' eval.txt
