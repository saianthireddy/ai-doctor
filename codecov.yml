coverage:
  status:
    project:
      default:
        target: 90%
        threshold: 2%
    patch:
      default:
        target: 85%

comment:
  layout: "reach, diff, flags, files"
  behavior: default

# No `ignore` list. Codecov ignores *paths*, not symbols, so a "file::Class"
# entry would be a no-op. The classes that need a network call or a model
# download are excluded at the source with `# pragma: no cover`, and are listed
# as unverified in the README status table rather than hidden from the metric.
